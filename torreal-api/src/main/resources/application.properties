server.port=8080

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3308}/${DB_NAME:torreal_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota&connectTimeout=15000&socketTimeout=30000&useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci
spring.http.encoding.charset=UTF-8
spring.http.encoding.force=true
spring.datasource.username=${DB_USER:torreal_admin}
spring.datasource.password=${DB_PASSWORD:admin123}

# Diagnóstico conexión MySQL (el error real aparece en logs al fallar login)
logging.level.org.springframework.jdbc.support=WARN
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

torreal.uploads.dir=${TORREAL_UPLOADS_DIR:./uploads}
torreal.uploads.public-prefix=/uploads

jwt.secret=${JWT_SECRET:torreal-dev-cambia-esto}
jwt.expiration-days=${JWT_EXPIRES_DAYS:7}

torreal.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}


